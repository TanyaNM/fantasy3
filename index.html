
<html>
<head>
  <meta charset="UTF-8">
  <title>Приєднатись до Експедиції</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="register-page">
  <div class="registration-container">
    <h1>📜 Приєднайся до Великої Подорожі</h1>
    <p>Заповни форму нижче, щоб стати частиною гільдії дослідників.</p>

    <form action="thankyou.html" method="post">
      <label for="name">Ім'я дослідника:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Магічна поштова адреса:</label>
      <input type="email" id="email" name="email" required>

      <label for="faction">Фракція (за бажанням):</label>
      <select id="faction" name="faction">
        <option>🌿 Лісові Спостерігачі</option>
        <option>🔥 Вартові Вогню</option>
        <option>💧 Архівісти Води</option>
        <option>🌪 Хроніки Вітру</option>
      </select>

      <button type="submit"><a href="https://tanyanm.github.io/fantasy4/">Увійти до Гільдії</a></button>
    </form>
  </div>
</body>
</html>
